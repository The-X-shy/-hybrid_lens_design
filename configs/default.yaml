# Default configuration for hybrid lens design pipeline
# 混合透镜设计流程的默认配置

# =============================================================================
# 通用设置
# =============================================================================
seed: 42
device: "cuda"  # "cuda", "cpu", "mps"
dtype: "float64"  # "float32" or "float64"

# =============================================================================
# 结果输出路径
# =============================================================================
output:
  base_dir: "./results"
  timestamp: true  # 是否添加时间戳到输出目录

# =============================================================================
# 透镜基本参数
# =============================================================================
lens:
  # 透镜来源: "file" 从文件加载, "create" 从头创建
  source: "create"
  
  # 如果 source: "file", 指定透镜文件路径
  file_path: null  # e.g., "./datasets/lenses/cellphone/cellphone68deg.json"
  
  # 如果 source: "create", 指定设计参数
  design:
    foclen: 8.0        # 焦距 (mm)
    fov: 80.0          # 对角线视场角 (度)
    fnum: 2.0          # 光圈数
    flange: 1.0        # 法兰距离 (mm)
    thickness: 10.0    # 总厚度 (mm)
    # 透镜结构: [[前表面类型, 后表面类型], ...]
    lens_type:
      - ["Aperture"]
      - ["Aspheric", "Aspheric"]
      - ["Aspheric", "Aspheric"]
      - ["Aspheric", "Aspheric"]
      - ["Aspheric", "Aspheric"]
      - ["Aspheric", "Aspheric"]

# =============================================================================
# DOE 配置 (用于 HybridLens)
# =============================================================================
doe:
  type: "binary2"      # DOE 类型: "binary2", "pixel2d"
  res: [1000, 1000]    # 分辨率 [H, W]
  fab_ps: 0.003        # 制造像素尺寸 (mm)
  is_square: true
  param_model: "binary2"  # 参数化模型
  # 初始多项式系数
  order2: 0.0
  order4: 0.0
  order6: 0.0
  order8: 0.0

# =============================================================================
# 超表面配置 (用于 MetaLens)
# =============================================================================
metasurface:
  type: "pixel2d"
  res: [1000, 1000]
  fab_ps: 0.003
  is_square: true

# =============================================================================
# 训练通用参数
# =============================================================================
training:
  # 采样配置
  spp: 2048            # 每个视场点的采样数
  num_ring: 8          # 径向环数
  num_arm: 8           # 角向臂数
  
  # PSF 配置
  psf_size: 101        # PSF 尺寸 (像素)
  
  # 评估间隔
  test_per_iter: 50

# =============================================================================
# 波长配置
# =============================================================================
wavelengths:
  rgb: [0.486, 0.55, 0.63]  # RGB 波长 (um)
