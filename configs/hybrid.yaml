# HybridLens training configuration (Refractive + DOE)
# 折衍混合透镜优化配置 (Binary2 DOE)

# 继承默认配置
_extends: default.yaml

# =============================================================================
# 输入透镜配置
# =============================================================================
lens:
  # 使用已优化的折射透镜
  source: "file"
  file_path: "./results/geolens/final_lens.json"  # 上一阶段输出的透镜文件

# =============================================================================
# DOE 配置
# =============================================================================
doe:
  type: "binary2"
  res: [1000, 1000]
  fab_ps: 0.003        # 3um 像素尺寸
  is_square: true
  param_model: "binary2"
  # 初始多项式系数
  order2: 0.0
  order4: 0.0
  order6: 0.0
  order8: 0.0
  # DOE 位置 (距传感器距离)
  distance_to_sensor: 0.5  # mm

# =============================================================================
# 优化配置
# =============================================================================
optimization:
  # DOE 学习率
  doe_lr: 0.1
  
  # 折射透镜学习率 [d, c, k, ai]
  # 使用较小的学习率因为折射部分已经优化过
  lens_lr: [0.0001, 0.0001, 0.01, 0.00001]
  lr_decay: 0.01
  
  # 训练配置
  iterations: 2000
  test_per_iter: 50

  # 单波段优化配置（默认 0.55um）
  wavelengths: [0.55]
  wavelength_weights: [1.0]
  
  # PSF 配置
  spp: 1000000         # 采样数
  psf_size: 101        # PSF 尺寸

# =============================================================================
# Sensor 配置
# =============================================================================
sensor:
  match_aperture: true  # 使 sensor 大小与光圈匹配
  res: [2000, 2000]     # sensor 分辨率
