# Metasurface HybridLens training configuration
# 超表面混合透镜优化配置 (Pixel2D metasurface)

# 继承默认配置
_extends: default.yaml

# =============================================================================
# 输入透镜配置
# =============================================================================
lens:
  # 使用已优化的折射透镜
  source: "file"
  file_path: "./results/geolens/final_lens.json"

# =============================================================================
# 超表面 DOE 配置 (Pixel2D)
# =============================================================================
metasurface:
  type: "pixel2d"      # Pixel2D 超表面模型
  res: [1000, 1000]    # 分辨率
  fab_ps: 0.003        # 3um 像素尺寸
  is_square: true
  # 相位范围
  phase_range: [0, 6.28318530718]  # 0 到 2*pi
  # DOE 位置 (距传感器距离)
  distance_to_sensor: 0.5  # mm

# =============================================================================
# 优化配置
# =============================================================================
optimization:
  # 超表面学习率
  doe_lr: 0.1
  
  # 折射透镜学习率 [d, c, k, ai]
  lens_lr: [0.0001, 0.0001, 0.01, 0.00001]
  lr_decay: 0.01
  
  # 训练配置
  iterations: 2000
  test_per_iter: 50
  
  # PSF 配置
  spp: 1000000
  psf_size: 101

# =============================================================================
# Sensor 配置
# =============================================================================
sensor:
  match_aperture: true
  res: [2000, 2000]

# =============================================================================
# 正则化
# =============================================================================
regularization:
  # 制造约束
  fabrication_penalty: 0.01  # 制造可行性惩罚
  smoothness: 0.001          # 相位平滑性约束
