[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-lens-design"
version = "0.1.0"
description = "Hybrid lens design pipeline: refractive lens + DOE/metasurface + neural network"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"

dependencies = [
    "torch>=2.0",
    "torchvision",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.20.0",
    "pyyaml>=6.0",
    "einops>=0.7.0",
    "lpips>=0.1.4",
    "timm>=0.9.0",
    "transformers>=4.30.0",
    "tqdm>=4.65.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipywidgets>=8.0.0",
]

[project.scripts]
train-geolens = "scripts.train_geolens:main"
train-hybridlens = "scripts.train_hybridlens:main"
train-metalens = "scripts.train_metalens:main"
train-e2e = "scripts.train_e2e:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
