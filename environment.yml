name: hybrid_lens
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python>=3.12
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - numpy
  - scipy
  - matplotlib
  - opencv
  - scikit-image
  - pyyaml
  - tqdm
  - pip
  - pip:
      - einops>=0.7.0
      - lpips>=0.1.4
      - timm>=0.9.0
      - transformers>=4.30.0
      - wandb>=0.15.0
      - -e ../DeepLens-main  # 本地可编辑安装 DeepLens
